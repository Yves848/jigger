# Fixture de capture — tmux
#
# tmux n'est pas là pour le confort : c'est lui qui rend les captures possibles.
# Le popup de jigger demande au terminal où est le curseur (DSR, « ESC[6n ») et
# n'attend la réponse que 150 ms ; au-delà de deux échecs il s'éteint pour la
# session. Un enregistreur qui s'interpose — VHS passe par ttyd et un xterm.js
# dans un Chrome sans écran — ne tient pas ce délai. tmux, lui, est un vrai
# émulateur local : il répond de son propre état, immédiatement. Le shell capturé
# tourne donc dans tmux, et tmux dans l'enregistreur.
#
# Voir docs/captures.md § « Pourquoi tmux ».

# La barre de statut date et localise la machine : elle affiche l'heure et le nom
# d'hôte. Deux choses qu'une capture de documentation ne doit pas porter, et qui
# suffiraient à faire diverger macOS d'Omarchy.
set -g status off

# Un terminal annoncé à l'identique partout, sinon les couleurs du cadre changent
# d'un OS à l'autre pour la seule raison que $TERM diffère.
set -g default-terminal "xterm-256color"

# Aucune latence sur l'échappement : la frappe pilotée est envoyée vite, et une
# temporisation d'échappement avalerait des touches.
set -sg escape-time 0

# Rien à garder : une capture ne rejoue pas d'historique.
set -g history-limit 50
set -g mouse off
