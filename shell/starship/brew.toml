# Bloc Homebrew pour starship — mode d'emploi dans le README de jigger, § « Bloc de
# prompt ». Les variables sont posées par le hook de jigger.plugin.zsh (JIGGER_PROMPT=1) ;
# sans elles, les modules disparaissent.
#
# Colle ces trois blocs à la fin de ~/.config/starship.toml. Rien d'autre à faire : le
# format par défaut de starship (« $all ») contient déjà $env_var. Pour placer le bloc
# ailleurs, écris un `format` explicite et pose-y ${env_var} — ou, module par module,
# ${env_var.JIGGER_BREW_VERSION}.
#
# La clé de section *est* le nom de la variable lue ; les trois modules s'affichent dans
# l'ordre où ils sont déclarés ici, et chacun s'efface tout seul quand sa variable n'est
# pas définie — un compteur à zéro n'en est jamais une.
#
# Glyphes Nerd Font : bière (brew), fiole (formulae), cube (casks). Ils prennent la couleur
# du module là où un émoji impose la sienne — mais ce n'est pas la raison du choix. Un émoji
# postérieur à Unicode 8 n'a pas de largeur sur laquelle le shell et le terminal s'accordent :
# le wcwidth() de macOS ne le connaît pas, zsh le compte alors pour 0 colonne quand le
# terminal en dessine 2, et ZLE perd un caractère à l'affichage dès que la ligne atteint le
# bord droit. L'éprouvette était exactement dans ce cas. Pour revenir à des émojis, n'en
# prendre que d'antérieurs à Unicode 9 — et le vérifier glyphe par glyphe, en comparant
# ${(m)#c} sous zsh à ce que le terminal dessine réellement.
#
# Garder la forme échappée plutôt que le caractère en clair : c'est la seule qui traverse
# sans dommage les éditeurs, les copier-coller et les outils qui normalisent l'Unicode.
#
# Pour un seul chiffre au lieu du détail par type, remplacer les deux derniers blocs par
# celui-ci :
#
#   [env_var.JIGGER_BREW_OUTDATED]
#   symbol = "\u21E1 "
#   style  = "#F9E2AF"
#   format = "[$symbol$env_value]($style) "

[env_var.JIGGER_BREW_VERSION]
symbol = "\uF0FC "
style  = "#FAB387"
format = "[$symbol$env_value]($style) "

[env_var.JIGGER_BREW_FORMULAE]
symbol = "\uF0C3 "
style  = "#F9E2AF"
format = "[$symbol$env_value]($style) "

[env_var.JIGGER_BREW_CASKS]
symbol = "\uF1B2 "
style  = "#F9E2AF"
format = "[$symbol$env_value]($style) "
