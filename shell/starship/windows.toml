# Bloc winget/scoop pour starship — mode d'emploi dans le README de jigger, § « Bloc de
# prompt ». Les variables sont posées par le hook de jigger.psm1 (JIGGER_PROMPT=1) ; sans
# elles, les modules disparaissent.
#
# Colle ces trois blocs à la fin de ~/.config/starship.toml. Rien d'autre à faire : le
# format par défaut de starship (« $all ») contient déjà $env_var. Pour placer le bloc
# ailleurs, écris un `format` explicite et pose-y ${env_var} — ou, module par module,
# ${env_var.JIGGER_WINGET_VERSION}.
#
# La clé de section *est* le nom de la variable lue ; les trois modules s'affichent dans
# l'ordre où ils sont déclarés ici, et chacun s'efface tout seul quand sa variable n'est
# pas définie — un compteur à zéro n'en est jamais une. Sur une machine qui n'a que scoop,
# le bloc se réduit donc à la cuillère et son compteur, là où le segment oh-my-posh, qui
# suspend tout à la version de winget, ne montrerait rien.
#
# Émojis : portable (version de winget), colis (paquets winget à mettre à niveau), cuillère
# (applications scoop) — aucune police particulière requise. Pour des glyphes Nerd Font
# monochromes, qui prennent la couleur du module là où un émoji impose la sienne,
# remplacer \U0001F4BB par \uE70F, \U0001F4E6 par \uF1B2 et \U0001F944 par \uF0F5.
#
# Le portable a remplacé la fenêtre \U0001FA9F, et ce n'est pas un choix esthétique : les
# émojis postérieurs à Unicode 8 n'ont pas de largeur sur laquelle shell et terminal
# s'accordent. Le wcwidth() de macOS ne les connaît pas et les rend de largeur nulle, quand
# le terminal en dessine deux — de quoi décaler le curseur et faire disparaître un caractère
# de la ligne de commande. Mesuré sur ce fichier : \U0001FA9F valait 0 sous zsh. À éviter
# aussi, dans l'autre sens, les glyphes à présentation texte par défaut (\U0001F5A5 écran,
# \U0001F6E0 outils), que zsh compte pour deux colonnes et le terminal dessine sur une.
#
# Garder la forme échappée plutôt que le caractère en clair : c'est la seule qui traverse
# sans dommage les éditeurs, les copier-coller et les outils qui normalisent l'Unicode.
#
# Pour un seul chiffre au lieu du détail par gestionnaire, remplacer les deux derniers
# blocs par celui-ci :
#
#   [env_var.JIGGER_OUTDATED]
#   symbol = "\u21E1 "
#   style  = "#F9E2AF"
#   format = "[$symbol$env_value]($style) "

[env_var.JIGGER_WINGET_VERSION]
symbol = "\U0001F4BB "
style  = "#FAB387"
format = "[$symbol$env_value]($style) "

[env_var.JIGGER_WINGET_OUTDATED]
symbol = "\U0001F4E6 "
style  = "#F9E2AF"
format = "[$symbol$env_value]($style) "

[env_var.JIGGER_SCOOP_OUTDATED]
symbol = "\U0001F944 "
style  = "#F9E2AF"
format = "[$symbol$env_value]($style) "
