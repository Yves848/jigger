ShortDescription: One syntax for winget, scoop, Homebrew and pacman, with a live popup that follows your typing.
Description: |-
  jigger is a small, self-contained Go binary wired into PowerShell. The moment you type
  a package-manager command, a popup appears under the prompt and tracks your keystrokes,
  offering the candidates that fit the context. Tab inserts the current one; Enter
  completes the last part and runs the line in a single keystroke.

  It never replaces your commands: winget install and scoop install keep working exactly
  as before, popup included. The jg facade adds one syntax across every manager on the
  machine, and the same popup completes ssh, scp and sftp from your ~/.ssh/config.

  The binary alone completes nothing: the PowerShell module that draws the popup is
  imported from the repository. See the guided tour at https://jigger.yg-devworks.com/parcours.html
