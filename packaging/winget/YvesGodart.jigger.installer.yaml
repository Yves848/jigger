# Le zip ne contient pas d'installeur : jigger.exe est un exécutable autonome,
# posé à la racine de l'archive. « portable » est donc le type juste, et winget
# se charge lui-même de l'alias sur le PATH.
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: jigger.exe
    PortableCommandAlias: jigger
Installers:
