server {
    listen 80;
    listen [::]:80;
    server_name jigger.yg-devworks.com;

    root /var/www/jigger/current;
    index index.html;

    access_log /var/log/nginx/jigger.access.log;
    error_log /var/log/nginx/jigger.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
