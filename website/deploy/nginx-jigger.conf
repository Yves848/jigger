server {
    listen 80;
    listen [::]:80;
    server_name jigger.yg-devworks.com;

    root /var/www/jigger/current;
    index index.html;

    access_log /var/log/nginx/jigger.access.log;
    error_log /var/log/nginx/jigger.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # `=404` et non `/index.html` : le site n'a aucun routage côté client, donc
    # aucune URL inconnue n'a de sens à servir l'accueil. Le repli renvoyait 200
    # sur n'importe quel chemin — /robots.txt et /sitemap.xml compris, qui
    # semblaient donc exister —, ce qu'un moteur lit comme une infinité de pages
    # dupliquées et pénalise. Une adresse fausse doit le dire.
    location / {
        try_files $uri $uri/ =404;
    }

    # Le fichier n'a pas d'extension : sans cette ligne il part en
    # `application/octet-stream`, le type par défaut de nginx. Bluesky ne lit que le
    # corps et s'en accommoderait, mais `nosniff` est posé plus haut — un navigateur
    # le proposerait donc au téléchargement au lieu de l'afficher, ce qui rend le
    # diagnostic pénible le jour où l'on veut simplement vérifier à l'œil ce qui est
    # servi.
    location = /.well-known/atproto-did {
        default_type text/plain;
    }

    # ── Statistiques de visite ────────────────────────────────────────────────────
    #
    # Rapport GoAccess régénéré depuis les journaux par un timer systemd (cf.
    # deploy/stats/). Rien n'est calculé chez le visiteur : ni script, ni cookie, ni
    # tiers. Les IP sont anonymisées et les robots écartés à la génération.
    # `absolute_redirect off` : nginx écoute en clair derrière Caddy, qui termine le
    # TLS. Sans cette ligne, il reconstruit une URL absolue avec le schéma qu'il croit
    # voir — `http://` — et le visiteur sort de HTTPS le temps d'un aller-retour, que
    # la redirection de Caddy rattrape ensuite. Un en-tête `Location` relatif laisse le
    # navigateur conserver le schéma d'origine. Constaté, pas supposé.
    location = /stats {
        absolute_redirect off;
        return 301 /stats/;
    }
    location /stats/ {
        auth_basic "jigger — statistiques";
        auth_basic_user_file /etc/nginx/jigger-stats.htpasswd;
        alias /var/www/jigger-stats/;
        index index.html;

        # Les CINQ en-têtes sont répétés, et ce n'est pas une redondance : un
        # `add_header` posé dans un `location` ANNULE tous ceux du bloc serveur. Le même
        # piège est déjà documenté plus bas pour le bloc des ressources statiques, où il
        # avait fait repartir les fichiers sans CSP ni `nosniff`. Ne pas en retirer un
        # seul en croyant qu'il est hérité.
        #
        # La CSP est relâchée ICI ET NULLE PART AILLEURS : le rapport GoAccess embarque
        # tout son JavaScript et son CSS en ligne. Sous la CSP stricte du site, la page
        # s'affiche entièrement vide, sans autre trace qu'un message dans la console du
        # navigateur — un mode de panne qui coûte cher à diagnostiquer.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # ── État de la chaîne de distribution ─────────────────────────────────────────
    #
    # Page statique régénérée toutes les quinze minutes (cf. deploy/etat/). Elle ne
    # montre que des données publiques — versions des canaux de distribution, état du
    # dernier pipeline — mais reste derrière le même mot de passe que /stats/ : c'est un
    # outil de maintenance, et une page qui a l'air cassée quand une source ne répond pas
    # n'a rien à faire sous les yeux d'un visiteur.
    location = /etat { absolute_redirect off; return 301 /etat/; }
    location /etat/ {
        auth_basic "jigger — etat";
        auth_basic_user_file /etc/nginx/jigger-stats.htpasswd;
        alias /var/www/jigger-etat/;
        index index.html;

        # Les quatre en-têtes sont répétés pour la même raison qu'ailleurs : un
        # `add_header` dans un `location` annule ceux du bloc serveur.
        #
        # La CSP reste STRICTE ici, contrairement à /stats/. Le générateur écrit sa
        # feuille de style dans un fichier voisin plutôt que de l'incorporer, ce qui
        # évite d'avoir à autoriser l'inline — GoAccess, lui, ne laissait pas le choix.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Les fichiers ne portent pas d'empreinte dans leur nom : `styles.css` reste
    # `styles.css` d'un déploiement à l'autre, et une capture refaite garde le
    # sien — c'est même le protocole. Un cache à durée fixe servait donc l'ancien
    # fichier pendant une semaine, sans même demander au serveur : le visiteur
    # voyait le HTML du jour habillé par le CSS de la veille, les schémas SVG
    # tombant sur leurs valeurs par défaut. On revalide plutôt : le navigateur
    # redemande à chaque fois et nginx répond 304 sur l'ETag quand rien n'a bougé.
    #
    # `expires -1` et non `add_header Cache-Control` : un `add_header` posé ici
    # annule ceux du bloc serveur, et ces fichiers repartaient alors sans CSP,
    # sans `nosniff`, sans `X-Frame-Options` ni `Referrer-Policy`. `expires`
    # n'est pas un `add_header` : l'héritage des quatre en-têtes est préservé.
    location ~* \.(?:png|svg|css|js|mp4)$ {
        expires -1;
    }
}
